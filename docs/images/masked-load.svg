<line x1="816" y1="166" x2="500" y2="234" stroke="#2563eb" stroke-width="1.5" marker-end="url(#ab)"/>
<text x="740" y="196" font-size="12" fill="#2563eb" text-anchor="middle">LoadFloat32x8Part(a[16:])</text>

