<rect x="667" y="242" width="60" height="44" rx="4" fill="#f3f4f6" stroke="#d1d5db" stroke-width="1.2"/><text x="697" y="269" font-size="11" fill="#6b7280" text-anchor="middle">0</text>
<line x1="481" y1="298" x2="727" y2="298" stroke="#9ca3af" stroke-width="1"/>
<text x="604" y="316" font-size="12" fill="#6b7280" text-anchor="middle">足りないレーンはゼロ埋め</text>

<!-- bottom note -->
<rect x="160" y="352" width="640" height="52" rx="8" fill="#f0fdf4" stroke="#bbf7d0" stroke-width="1.5"/>
<text x="480" y="384" font-size="13" fill="#111827" text-anchor="middle">内積ではゼロ埋めのレーンは「0 を掛けて足す」だけなので、結果は変わらない</text>
</svg>
