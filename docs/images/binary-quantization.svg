<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 600">
<defs><marker id="ab" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto"><polygon points="0 0, 10 3.5, 0 7" fill="#2563eb"/></marker></defs>
<style>text{font-family:'Helvetica Neue', Helvetica, Arial, 'Hiragino Sans', 'Hiragino Kaku Gothic ProN', sans-serif;}</style>
<rect width="960" height="600" fill="#ffffff"/>
<text x="480" y="36" font-size="18" font-weight="600" fill="#111827" text-anchor="middle">バイナリ量子化 — float32 を符号1ビットに潰す</text>
<rect x="100" y="80" width="84" height="44" rx="6" fill="#eff6ff" stroke="#bfdbfe" stroke-width="1.5"/>
<text x="142" y="107" font-size="13" fill="#111827" text-anchor="middle">0.12</text>
<rect x="192" y="80" width="84" height="44" rx="6" fill="#eff6ff" stroke="#bfdbfe" stroke-width="1.5"/>
<text x="234" y="107" font-size="13" fill="#111827" text-anchor="middle">-0.83</text>
<rect x="284" y="80" width="84" height="44" rx="6" fill="#eff6ff" stroke="#bfdbfe" stroke-width="1.5"/>
<text x="326" y="107" font-size="13" fill="#111827" text-anchor="middle">0.45</text>
<rect x="376" y="80" width="84" height="44" rx="6" fill="#eff6ff" stroke="#bfdbfe" stroke-width="1.5"/>
<text x="418" y="107" font-size="13" fill="#111827" text-anchor="middle">-0.07</text>
<rect x="468" y="80" width="84" height="44" rx="6" fill="#eff6ff" stroke="#bfdbfe" stroke-width="1.5"/>
<text x="510" y="107" font-size="13" fill="#111827" text-anchor="middle">0.91</text>
<rect x="560" y="80" width="84" height="44" rx="6" fill="#eff6ff" stroke="#bfdbfe" stroke-width="1.5"/>
<text x="602" y="107" font-size="13" fill="#111827" text-anchor="middle">-0.33</text>
<rect x="652" y="80" width="84" height="44" rx="6" fill="#eff6ff" stroke="#bfdbfe" stroke-width="1.5"/>
<text x="694" y="107" font-size="13" fill="#111827" text-anchor="middle">0.28</text>
<rect x="744" y="80" width="84" height="44" rx="6" fill="#eff6ff" stroke="#bfdbfe" stroke-width="1.5"/>
<text x="786" y="107" font-size="13" fill="#111827" text-anchor="middle">-0.56</text>
<text x="884" y="107" font-size="13" fill="#6b7280">…</text>
<text x="480" y="148" font-size="12" fill="#6b7280" text-anchor="middle">float32 × 384次元 = 1,536 バイト / 1ベクトル</text>
<line x1="480" y1="160" x2="480" y2="200" stroke="#2563eb" stroke-width="2" marker-end="url(#ab)"/>
<rect x="386" y="166" width="190" height="20" fill="#ffffff" opacity="0.95"/>
<text x="481" y="180" font-size="12" fill="#2563eb" text-anchor="middle">正なら 1、それ以外は 0</text>
<rect x="296" y="208" width="40" height="40" rx="4" fill="#dcfce7" stroke="#d1d5db" stroke-width="1.2"/>
<text x="316" y="233" font-size="14" font-weight="600" fill="#111827" text-anchor="middle">1</text>
<rect x="342" y="208" width="40" height="40" rx="4" fill="#f9fafb" stroke="#d1d5db" stroke-width="1.2"/>
<text x="362" y="233" font-size="14" font-weight="600" fill="#111827" text-anchor="middle">0</text>
<rect x="388" y="208" width="40" height="40" rx="4" fill="#dcfce7" stroke="#d1d5db" stroke-width="1.2"/>
<text x="408" y="233" font-size="14" font-weight="600" fill="#111827" text-anchor="middle">1</text>
<rect x="434" y="208" width="40" height="40" rx="4" fill="#f9fafb" stroke="#d1d5db" stroke-width="1.2"/>
<text x="454" y="233" font-size="14" font-weight="600" fill="#111827" text-anchor="middle">0</text>
<rect x="480" y="208" width="40" height="40" rx="4" fill="#dcfce7" stroke="#d1d5db" stroke-width="1.2"/>
<text x="500" y="233" font-size="14" font-weight="600" fill="#111827" text-anchor="middle">1</text>
<rect x="526" y="208" width="40" height="40" rx="4" fill="#f9fafb" stroke="#d1d5db" stroke-width="1.2"/>
<text x="546" y="233" font-size="14" font-weight="600" fill="#111827" text-anchor="middle">0</text>
<rect x="572" y="208" width="40" height="40" rx="4" fill="#dcfce7" stroke="#d1d5db" stroke-width="1.2"/>
<text x="592" y="233" font-size="14" font-weight="600" fill="#111827" text-anchor="middle">1</text>
<rect x="618" y="208" width="40" height="40" rx="4" fill="#f9fafb" stroke="#d1d5db" stroke-width="1.2"/>
<text x="638" y="233" font-size="14" font-weight="600" fill="#111827" text-anchor="middle">0</text>
<text x="672" y="233" font-size="13" fill="#6b7280">…</text>
<text x="480" y="276" font-size="12" fill="#6b7280" text-anchor="middle">1bit × 384次元 = 48 バイト / 1ベクトル</text>
<rect x="330" y="292" width="300" height="40" rx="8" fill="#f0fdf4" stroke="#bbf7d0" stroke-width="1.5"/>
<text x="480" y="318" font-size="14" font-weight="600" fill="#16a34a" text-anchor="middle">153MB → 4.8MB(1/32)キャッシュに乗る!</text>
<text x="480" y="380" font-size="15" font-weight="600" fill="#111827" text-anchor="middle">距離計算もビット演算 2 つだけ(ハミング距離)</text>
<text x="250" y="420" font-size="13" fill="#111827" text-anchor="middle">a = 1 0 1 0 1 0 1 0</text>
<text x="250" y="444" font-size="13" fill="#111827" text-anchor="middle">b = 1 1 0 0 1 0 1 1</text>
<line x1="340" y1="430" x2="420" y2="430" stroke="#2563eb" stroke-width="1.5" marker-end="url(#ab)"/>
<rect x="352" y="408" width="58" height="18" fill="#ffffff" opacity="0.95"/>
<text x="380" y="421" font-size="11" fill="#2563eb" text-anchor="middle">XOR</text>
<text x="500" y="436" font-size="13" fill="#111827" text-anchor="middle">0 1 1 0 0 0 0 1</text>
<line x1="580" y1="430" x2="660" y2="430" stroke="#2563eb" stroke-width="1.5" marker-end="url(#ab)"/>
<rect x="585" y="408" width="74" height="18" fill="#ffffff" opacity="0.95"/>
<text x="621" y="421" font-size="11" fill="#2563eb" text-anchor="middle">popcount</text>
<rect x="668" y="404" width="180" height="52" rx="8" fill="#fff7ed" stroke="#fed7aa" stroke-width="1.5"/>
<text x="758" y="426" font-size="13" fill="#111827" text-anchor="middle">立っているビット数 = 3</text>
<text x="758" y="446" font-size="11" fill="#6b7280" text-anchor="middle">小さいほど似ている</text>
<rect x="40" y="490" width="880" height="80" rx="8" fill="#f9fafb" stroke="#d1d5db" stroke-width="1"/>
<text x="60" y="520" font-size="13" fill="#111827">popcount は math/bits.OnesCount64 がそのまま CPU 命令(POPCNT)1発になる。SIMD なしのスカラーコードで</text>
<text x="60" y="546" font-size="13" fill="#111827">全探索 28.6ms → 0.68ms(42倍)。データ表現の変更は、ときに SIMD より強い。</text>
</svg>