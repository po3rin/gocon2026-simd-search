<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 560">
<defs><marker id="ab" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto"><polygon points="0 0, 10 3.5, 0 7" fill="#2563eb"/></marker></defs>
<style>text{font-family:'Helvetica Neue', Helvetica, Arial, 'Hiragino Sans', 'Hiragino Kaku Gothic ProN', sans-serif;}</style>
<rect width="960" height="560" fill="#ffffff"/>
<text x="480" y="36" font-size="18" font-weight="600" fill="#111827" text-anchor="middle">スカラー vs SIMD — 1命令で処理できるデータ量</text>
<rect x="40" y="60" width="420" height="440" rx="8" fill="#ffffff" stroke="#d1d5db" stroke-width="1.5"/>
<text x="250" y="90" font-size="15" font-weight="600" fill="#111827" text-anchor="middle">スカラー(普通のコード)</text>
<text x="250" y="112" font-size="12" fill="#6b7280" text-anchor="middle">sum += a[i] * b[i]</text>
<rect x="120" y="140" width="80" height="44" rx="6" fill="#eff6ff" stroke="#bfdbfe" stroke-width="1.5"/>
<text x="160" y="167" font-size="13" fill="#111827" text-anchor="middle">a[0]</text>
<rect x="300" y="140" width="80" height="44" rx="6" fill="#f0fdf4" stroke="#bbf7d0" stroke-width="1.5"/>
<text x="340" y="167" font-size="13" fill="#111827" text-anchor="middle">b[0]</text>
<text x="250" y="170" font-size="16" fill="#6b7280" text-anchor="middle">×</text>
<line x1="250" y1="190" x2="250" y2="230" stroke="#2563eb" stroke-width="1.5" marker-end="url(#ab)"/>
<rect x="190" y="236" width="120" height="44" rx="6" fill="#fff7ed" stroke="#fed7aa" stroke-width="1.5"/>
<text x="250" y="263" font-size="13" fill="#111827" text-anchor="middle">1個の掛け算</text>
<text x="250" y="320" font-size="13" fill="#111827" text-anchor="middle">1命令 = float32 を 1個</text>
<rect x="100" y="350" width="300" height="64" rx="8" fill="#fef2f2" stroke="#fecaca" stroke-width="1.5"/>
<text x="250" y="377" font-size="13" fill="#111827" text-anchor="middle">384次元の内積に</text>
<text x="250" y="398" font-size="14" font-weight="600" fill="#dc2626" text-anchor="middle">384回 の繰り返し</text>
<rect x="500" y="60" width="420" height="440" rx="8" fill="#ffffff" stroke="#d1d5db" stroke-width="1.5"/>
<text x="710" y="90" font-size="15" font-weight="600" fill="#111827" text-anchor="middle">SIMD(Float32x8)</text>
<text x="710" y="112" font-size="12" fill="#6b7280" text-anchor="middle">acc = va.MulAdd(vb, acc)</text>
<rect x="540" y="140" width="38" height="34" rx="4" fill="#eff6ff" stroke="#bfdbfe" stroke-width="1.2"/>
<text x="559" y="162" font-size="11" fill="#111827" text-anchor="middle">a[0]</text>
<rect x="582" y="140" width="38" height="34" rx="4" fill="#eff6ff" stroke="#bfdbfe" stroke-width="1.2"/>
<text x="601" y="162" font-size="11" fill="#111827" text-anchor="middle">a[1]</text>
<rect x="624" y="140" width="38" height="34" rx="4" fill="#eff6ff" stroke="#bfdbfe" stroke-width="1.2"/>
<text x="643" y="162" font-size="11" fill="#111827" text-anchor="middle">a[2]</text>
<rect x="666" y="140" width="38" height="34" rx="4" fill="#eff6ff" stroke="#bfdbfe" stroke-width="1.2"/>
<text x="685" y="162" font-size="11" fill="#111827" text-anchor="middle">a[3]</text>
<rect x="708" y="140" width="38" height="34" rx="4" fill="#eff6ff" stroke="#bfdbfe" stroke-width="1.2"/>
<text x="727" y="162" font-size="11" fill="#111827" text-anchor="middle">a[4]</text>
<rect x="750" y="140" width="38" height="34" rx="4" fill="#eff6ff" stroke="#bfdbfe" stroke-width="1.2"/>
<text x="769" y="162" font-size="11" fill="#111827" text-anchor="middle">a[5]</text>
<rect x="792" y="140" width="38" height="34" rx="4" fill="#eff6ff" stroke="#bfdbfe" stroke-width="1.2"/>
<text x="811" y="162" font-size="11" fill="#111827" text-anchor="middle">a[6]</text>
<rect x="834" y="140" width="38" height="34" rx="4" fill="#eff6ff" stroke="#bfdbfe" stroke-width="1.2"/>
<text x="853" y="162" font-size="11" fill="#111827" text-anchor="middle">a[7]</text>
<rect x="540" y="186" width="38" height="34" rx="4" fill="#f0fdf4" stroke="#bbf7d0" stroke-width="1.2"/>
<text x="559" y="208" font-size="11" fill="#111827" text-anchor="middle">b[0]</text>
<rect x="582" y="186" width="38" height="34" rx="4" fill="#f0fdf4" stroke="#bbf7d0" stroke-width="1.2"/>
<text x="601" y="208" font-size="11" fill="#111827" text-anchor="middle">b[1]</text>
<rect x="624" y="186" width="38" height="34" rx="4" fill="#f0fdf4" stroke="#bbf7d0" stroke-width="1.2"/>
<text x="643" y="208" font-size="11" fill="#111827" text-anchor="middle">b[2]</text>
<rect x="666" y="186" width="38" height="34" rx="4" fill="#f0fdf4" stroke="#bbf7d0" stroke-width="1.2"/>
<text x="685" y="208" font-size="11" fill="#111827" text-anchor="middle">b[3]</text>
<rect x="708" y="186" width="38" height="34" rx="4" fill="#f0fdf4" stroke="#bbf7d0" stroke-width="1.2"/>
<text x="727" y="208" font-size="11" fill="#111827" text-anchor="middle">b[4]</text>
<rect x="750" y="186" width="38" height="34" rx="4" fill="#f0fdf4" stroke="#bbf7d0" stroke-width="1.2"/>
<text x="769" y="208" font-size="11" fill="#111827" text-anchor="middle">b[5]</text>
<rect x="792" y="186" width="38" height="34" rx="4" fill="#f0fdf4" stroke="#bbf7d0" stroke-width="1.2"/>
<text x="811" y="208" font-size="11" fill="#111827" text-anchor="middle">b[6]</text>
<rect x="834" y="186" width="38" height="34" rx="4" fill="#f0fdf4" stroke="#bbf7d0" stroke-width="1.2"/>
<text x="853" y="208" font-size="11" fill="#111827" text-anchor="middle">b[7]</text>
<text x="524" y="184" font-size="14" fill="#6b7280" text-anchor="middle">×</text>
<line x1="710" y1="228" x2="710" y2="262" stroke="#2563eb" stroke-width="1.5" marker-end="url(#ab)"/>
<rect x="560" y="268" width="300" height="44" rx="6" fill="#fff7ed" stroke="#fed7aa" stroke-width="1.5"/>
<text x="710" y="295" font-size="13" fill="#111827" text-anchor="middle">8個の掛け算+加算を 1命令(FMA)で</text>
<text x="710" y="346" font-size="13" fill="#111827" text-anchor="middle">1命令 = float32 を 8個(256bitレジスタ)</text>
<rect x="560" y="370" width="300" height="64" rx="8" fill="#f0fdf4" stroke="#bbf7d0" stroke-width="1.5"/>
<text x="710" y="397" font-size="13" fill="#111827" text-anchor="middle">384次元の内積が</text>
<text x="710" y="418" font-size="14" font-weight="600" fill="#16a34a" text-anchor="middle">48回 で終わる(理論上8倍)</text>
<text x="480" y="534" font-size="12" fill="#6b7280" text-anchor="middle">SIMD = Single Instruction, Multiple Data。Go 1.26 では GOEXPERIMENT=simd で simd/archsimd パッケージが使える(amd64限定)</text>
</svg>