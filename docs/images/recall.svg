<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 420">
<style>text{font-family:'Helvetica Neue', Helvetica, Arial, 'Hiragino Sans', 'Hiragino Kaku Gothic ProN', sans-serif;}</style>
<rect width="960" height="420" fill="#ffffff"/>
<text x="480" y="36" font-size="18" font-weight="600" fill="#111827" text-anchor="middle">Recall@10 — 正解の上位 10 件と何件一致したか</text>
<text x="480" y="60" font-size="12" fill="#6b7280" text-anchor="middle">fp32 で正確に検索した上位 10 件を正解とし、int8 の上位 10 件が何件当たったかを数える</text>

<!-- row 1: 正解 (fp32) -->
<text x="133" y="100" font-size="13" font-weight="600" fill="#111827" text-anchor="start">正解: fp32 の上位 10 件</text>
<rect x="133" y="110" width="64" height="44" rx="6" fill="#eff6ff" stroke="#bfdbfe" stroke-width="1.5"/><text x="165" y="137" font-size="12" fill="#111827" text-anchor="middle">#4</text>
<rect x="203" y="110" width="64" height="44" rx="6" fill="#eff6ff" stroke="#bfdbfe" stroke-width="1.5"/><text x="235" y="137" font-size="12" fill="#111827" text-anchor="middle">#12</text>
<rect x="273" y="110" width="64" height="44" rx="6" fill="#eff6ff" stroke="#bfdbfe" stroke-width="1.5"/><text x="305" y="137" font-size="12" fill="#111827" text-anchor="middle">#31</text>
<rect x="343" y="110" width="64" height="44" rx="6" fill="#eff6ff" stroke="#bfdbfe" stroke-width="1.5"/><text x="375" y="137" font-size="12" fill="#111827" text-anchor="middle">#58</text>
<rect x="413" y="110" width="64" height="44" rx="6" fill="#eff6ff" stroke="#bfdbfe" stroke-width="1.5"/><text x="445" y="137" font-size="12" fill="#111827" text-anchor="middle">#7</text>
<rect x="483" y="110" width="64" height="44" rx="6" fill="#eff6ff" stroke="#bfdbfe" stroke-width="1.5"/><text x="515" y="137" font-size="12" fill="#111827" text-anchor="middle">#99</text>
<rect x="553" y="110" width="64" height="44" rx="6" fill="#eff6ff" stroke="#bfdbfe" stroke-width="1.5"/><text x="585" y="137" font-size="12" fill="#111827" text-anchor="middle">#23</text>
<rect x="623" y="110" width="64" height="44" rx="6" fill="#eff6ff" stroke="#bfdbfe" stroke-width="1.5"/><text x="655" y="137" font-size="12" fill="#111827" text-anchor="middle">#41</text>
<rect x="693" y="110" width="64" height="44" rx="6" fill="#eff6ff" stroke="#bfdbfe" stroke-width="1.5"/><text x="725" y="137" font-size="12" fill="#111827" text-anchor="middle">#86</text>
<rect x="763" y="110" width="64" height="44" rx="6" fill="#eff6ff" stroke="#bfdbfe" stroke-width="1.5"/><text x="795" y="137" font-size="12" fill="#111827" text-anchor="middle">#65</text>

<!-- row 2: int8 -->
<text x="133" y="210" font-size="13" font-weight="600" fill="#111827" text-anchor="start">int8 の上位 10 件(順位は多少入れ替わる)</text>
<rect x="133" y="220" width="64" height="44" rx="6" fill="#f0fdf4" stroke="#bbf7d0" stroke-width="1.5"/><text x="165" y="247" font-size="12" fill="#111827" text-anchor="middle">#12</text>
<rect x="203" y="220" width="64" height="44" rx="6" fill="#f0fdf4" stroke="#bbf7d0" stroke-width="1.5"/><text x="235" y="247" font-size="12" fill="#111827" text-anchor="middle">#4</text>
<rect x="273" y="220" width="64" height="44" rx="6" fill="#f0fdf4" stroke="#bbf7d0" stroke-width="1.5"/><text x="305" y="247" font-size="12" fill="#111827" text-anchor="middle">#31</text>
<rect x="343" y="220" width="64" height="44" rx="6" fill="#f0fdf4" stroke="#bbf7d0" stroke-width="1.5"/><text x="375" y="247" font-size="12" fill="#111827" text-anchor="middle">#7</text>
<rect x="413" y="220" width="64" height="44" rx="6" fill="#f0fdf4" stroke="#bbf7d0" stroke-width="1.5"/><text x="445" y="247" font-size="12" fill="#111827" text-anchor="middle">#58</text>
<rect x="483" y="220" width="64" height="44" rx="6" fill="#f0fdf4" stroke="#bbf7d0" stroke-width="1.5"/><text x="515" y="247" font-size="12" fill="#111827" text-anchor="middle">#99</text>
<rect x="553" y="220" width="64" height="44" rx="6" fill="#f0fdf4" stroke="#bbf7d0" stroke-width="1.5"/><text x="585" y="247" font-size="12" fill="#111827" text-anchor="middle">#41</text>
<rect x="623" y="220" width="64" height="44" rx="6" fill="#f0fdf4" stroke="#bbf7d0" stroke-width="1.5"/><text x="655" y="247" font-size="12" fill="#111827" text-anchor="middle">#23</text>
<rect x="693" y="220" width="64" height="44" rx="6" fill="#f0fdf4" stroke="#bbf7d0" stroke-width="1.5"/><text x="725" y="247" font-size="12" fill="#111827" text-anchor="middle">#86</text>
<rect x="763" y="220" width="64" height="44" rx="6" fill="#fef2f2" stroke="#fecaca" stroke-width="1.5"/><text x="795" y="247" font-size="12" fill="#dc2626" text-anchor="middle">#70</text>
<text x="795" y="284" font-size="11" fill="#dc2626" text-anchor="middle">正解に無い(#65 を落とした)</text>

<!-- legend -->
<rect x="133" y="300" width="14" height="14" rx="3" fill="#f0fdf4" stroke="#bbf7d0" stroke-width="1.5"/>
<text x="153" y="312" font-size="12" fill="#6b7280" text-anchor="start">正解と一致(9 件)</text>
<rect x="290" y="300" width="14" height="14" rx="3" fill="#fef2f2" stroke="#fecaca" stroke-width="1.5"/>
<text x="310" y="312" font-size="12" fill="#6b7280" text-anchor="start">不一致(1 件)</text>

<!-- bottom note -->
<rect x="180" y="340" width="600" height="52" rx="8" fill="#fff7ed" stroke="#fed7aa" stroke-width="1.5"/>
<text x="480" y="365" font-size="14" font-weight="600" fill="#111827" text-anchor="middle">Recall@10 = 一致した件数 ÷ 10 = 9 ÷ 10 = 0.9</text>
<text x="480" y="384" font-size="12" fill="#6b7280" text-anchor="middle">順位のずれは数えない。上位 10 件に何件残っているかだけを見る</text>
</svg>
