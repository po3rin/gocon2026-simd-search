<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 560">
<style>text{font-family:'Helvetica Neue', Helvetica, Arial, 'Hiragino Sans', 'Hiragino Kaku Gothic ProN', sans-serif;}</style>
<rect width="960" height="560" fill="#ffffff"/>
<text x="480" y="36" font-size="18" font-weight="600" fill="#111827" text-anchor="middle">高速化の階段 — 1クエリあたりの時間(10万件 × 384次元)</text>
<rect x="110" y="110" width="120" height="360" rx="6" fill="#bfdbfe" stroke="#93c5fd" stroke-width="1.5"/>
<text x="170" y="76" font-size="15" font-weight="600" fill="#111827" text-anchor="middle">1.0x</text>
<text x="170" y="96" font-size="13" fill="#111827" text-anchor="middle">28.6 ms</text>
<text x="170" y="494" font-size="13" font-weight="600" fill="#111827" text-anchor="middle">Stage 0</text>
<text x="170" y="514" font-size="11" fill="#6b7280" text-anchor="middle">スカラー全探索</text>
<rect x="320" y="140" width="120" height="330" rx="6" fill="#bfdbfe" stroke="#93c5fd" stroke-width="1.5"/>
<text x="380" y="106" font-size="15" font-weight="600" fill="#111827" text-anchor="middle">1.6x</text>
<text x="380" y="126" font-size="13" fill="#111827" text-anchor="middle">18.0 ms</text>
<text x="380" y="494" font-size="13" font-weight="600" fill="#111827" text-anchor="middle">Stage 1</text>
<text x="380" y="514" font-size="11" fill="#6b7280" text-anchor="middle">SIMD化</text>
<rect x="530" y="380" width="120" height="90" rx="6" fill="#bbf7d0" stroke="#86efac" stroke-width="1.5"/>
<text x="590" y="346" font-size="15" font-weight="600" fill="#16a34a" text-anchor="middle">42x</text>
<text x="590" y="366" font-size="13" fill="#111827" text-anchor="middle">0.68 ms</text>
<text x="590" y="494" font-size="13" font-weight="600" fill="#111827" text-anchor="middle">Stage 2</text>
<text x="590" y="514" font-size="11" fill="#6b7280" text-anchor="middle">バイナリ量子化</text>
<rect x="740" y="370" width="120" height="100" rx="6" fill="#bbf7d0" stroke="#86efac" stroke-width="1.5"/>
<text x="800" y="336" font-size="15" font-weight="600" fill="#16a34a" text-anchor="middle">39x</text>
<text x="800" y="356" font-size="13" fill="#111827" text-anchor="middle">0.73 ms</text>
<text x="800" y="494" font-size="13" font-weight="600" fill="#111827" text-anchor="middle">仕上げ</text>
<text x="800" y="514" font-size="11" fill="#6b7280" text-anchor="middle">+ rerank(精度回復)</text>
<line x1="60" y1="470" x2="920" y2="470" stroke="#d1d5db" stroke-width="1.5"/>
<text x="425" y="120" font-size="12" fill="#dc2626" text-anchor="middle">SIMDだけでは1.6倍止まり</text>
<text x="425" y="140" font-size="12" fill="#dc2626" text-anchor="middle">(メモリ帯域の壁)</text>
<text x="635" y="300" font-size="12" fill="#16a34a" text-anchor="middle">データを1/32にしたら</text>
<text x="635" y="320" font-size="12" fill="#16a34a" text-anchor="middle">壁ごと消えた</text>
<text x="800" y="330" font-size="11" fill="#6b7280" text-anchor="middle">Recall@10 0.18→0.87</text>
<text x="480" y="540" font-size="12" fill="#6b7280" text-anchor="middle">※ 棒の高さは対数スケール風のイメージ。数字は AWS c7i (Xeon 8488C) / Go 1.26.4 での実測値</text>
</svg>