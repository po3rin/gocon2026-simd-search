<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 520">
<defs><marker id="ab" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto"><polygon points="0 0, 10 3.5, 0 7" fill="#2563eb"/></marker></defs>
<style>text{font-family:'Helvetica Neue',Helvetica,Arial,'Hiragino Sans','Hiragino Kaku Gothic ProN',sans-serif;fill:#111827}</style>
<rect width="960" height="520" fill="#ffffff"/>
<text x="480" y="34" font-size="18" font-weight="600" text-anchor="middle">Stage 5 の手順: 1bit で候補を絞り、fp32 で採点し直す</text>
<text x="480" y="56" font-size="11.5" fill="#6b7280" text-anchor="middle">k = 10 件を返す検索。1 段目で k × 10 = 100 件まで絞り、2 段目でその 100 件だけを正確に計算する</text>

<!-- 入力 -->
<rect x="40" y="120" width="180" height="120" rx="8" fill="#f9fafb" stroke="#d1d5db" stroke-width="1.5"/>
<text x="130" y="150" font-size="14" font-weight="600" text-anchor="middle">DB 10 万件</text>
<text x="130" y="176" font-size="11.5" fill="#6b7280" text-anchor="middle">1bit 版: 48 byte × 10 万 = 4.8 MB</text>
<text x="130" y="194" font-size="11.5" fill="#6b7280" text-anchor="middle">fp32 版: 1536 byte × 10 万 = 153.6 MB</text>
<text x="130" y="220" font-size="11.5" fill="#6b7280" text-anchor="middle">両方をメモリに持っておく</text>

<line x1="226" y1="180" x2="286" y2="180" stroke="#2563eb" stroke-width="1.8" marker-end="url(#ab)"/>

<!-- 1 段目 -->
<rect x="290" y="100" width="280" height="160" rx="8" fill="#f0fdf4" stroke="#bbf7d0" stroke-width="1.5"/>
<text x="430" y="128" font-size="14" font-weight="600" text-anchor="middle">1 段目: 1bit で絞る(Stage 4)</text>
<text x="430" y="152" font-size="11.5" fill="#374151" text-anchor="middle">10 万件すべてとハミング距離を計算</text>
<text x="430" y="170" font-size="11.5" fill="#374151" text-anchor="middle">4.8 MB はキャッシュに乗る。0.77 ms</text>
<text x="430" y="196" font-size="11.5" fill="#374151" text-anchor="middle">距離が近い順に上位 100 件を残す</text>
<text x="430" y="222" font-size="11.5" fill="#dc2626" text-anchor="middle">この 100 件の並び順は粗い</text>
<text x="430" y="240" font-size="11.5" fill="#dc2626" text-anchor="middle">(上位 10 件をそのまま返すと Recall 0.18)</text>

<line x1="576" y1="180" x2="636" y2="180" stroke="#2563eb" stroke-width="1.8" marker-end="url(#ab)"/>
<text x="606" y="168" font-size="11" fill="#2563eb" text-anchor="middle">100 件</text>

<!-- 2 段目 -->
<rect x="640" y="100" width="280" height="160" rx="8" fill="#eff6ff" stroke="#bfdbfe" stroke-width="1.5"/>
<text x="780" y="128" font-size="14" font-weight="600" text-anchor="middle">2 段目: fp32 で採点し直す</text>
<text x="780" y="152" font-size="11.5" fill="#374151" text-anchor="middle">100 件だけ fp32 版を読み、正確な内積を計算</text>
<text x="780" y="170" font-size="11.5" fill="#374151" text-anchor="middle">Stage 1 の SIMD カーネル vec.Dot をそのまま使う</text>
<text x="780" y="196" font-size="11.5" fill="#374151" text-anchor="middle">100 件 × 1536 byte = 154 KB。キャッシュに乗る</text>
<text x="780" y="222" font-size="11.5" fill="#16a34a" text-anchor="middle">追加の時間は 0.05 ms</text>
<text x="780" y="240" font-size="11.5" fill="#16a34a" text-anchor="middle">内積の大きい順に並べ直して上位 10 件を返す</text>

<line x1="780" y1="266" x2="780" y2="306" stroke="#2563eb" stroke-width="1.8" marker-end="url(#ab)"/>

<!-- 出力 -->
<rect x="640" y="310" width="280" height="70" rx="8" fill="#ffffff" stroke="#d1d5db" stroke-width="1.5"/>
<text x="780" y="338" font-size="14" font-weight="600" text-anchor="middle">上位 10 件</text>
<text x="780" y="362" font-size="11.5" fill="#374151" text-anchor="middle">合計 0.82 ms、Recall@10 = 0.87</text>

<!-- 比較 -->
<rect x="40" y="410" width="880" height="86" rx="8" fill="#fffbeb" stroke="#fde68a" stroke-width="1.5"/>
<text x="60" y="436" font-size="12.5" font-weight="600">なぜ速いまま精度が戻るのか</text>
<text x="60" y="458" font-size="12">fp32 の内積を 10 万件すべてに行うと 7.9 ms(Stage 1)。2 段目はそれを 100 件、つまり 1/1000 だけ行うので 0.05 ms で済む</text>
<text x="60" y="480" font-size="12">1 段目の 100 件には正解 10 件のうち平均 8.7 件が残っている(rerank 後の Recall 0.87 から分かる)。その中を正確に並べ直すので精度が戻る</text>
</svg>
