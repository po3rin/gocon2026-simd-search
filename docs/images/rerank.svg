<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 460">
<defs><marker id="ab" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto"><polygon points="0 0, 10 3.5, 0 7" fill="#2563eb"/></marker></defs>
<style>text{font-family:'Helvetica Neue', Helvetica, Arial, 'Hiragino Sans', 'Hiragino Kaku Gothic ProN', sans-serif;}</style>
<rect width="960" height="460" fill="#ffffff"/>
<text x="480" y="36" font-size="18" font-weight="600" fill="#111827" text-anchor="middle">二段構えの検索 — 粗く絞って、正確に並べ直す(rerank)</text>
<rect x="40" y="120" width="180" height="120" rx="8" fill="#eff6ff" stroke="#bfdbfe" stroke-width="1.5"/>
<text x="130" y="165" font-size="14" font-weight="600" fill="#111827" text-anchor="middle">10万件</text>
<text x="130" y="190" font-size="12" fill="#6b7280" text-anchor="middle">全候補</text>
<line x1="220" y1="180" x2="320" y2="180" stroke="#2563eb" stroke-width="2.5" marker-end="url(#ab)"/>
<rect x="326" y="110" width="240" height="140" rx="8" fill="#f0fdf4" stroke="#bbf7d0" stroke-width="1.5"/>
<text x="446" y="142" font-size="14" font-weight="600" fill="#111827" text-anchor="middle">1段目: バイナリ検索</text>
<text x="446" y="168" font-size="12" fill="#6b7280" text-anchor="middle">1bit + ハミング距離</text>
<text x="446" y="194" font-size="12" fill="#111827" text-anchor="middle">粗いが爆速(0.68ms)</text>
<text x="446" y="220" font-size="12" fill="#dc2626" text-anchor="middle">単体だと Recall@10 = 0.18</text>
<line x1="566" y1="180" x2="666" y2="180" stroke="#2563eb" stroke-width="2.5" marker-end="url(#ab)"/>
<rect x="580" y="152" width="76" height="20" fill="#ffffff" opacity="0.95"/>
<text x="617" y="166" font-size="11" fill="#2563eb" text-anchor="middle">上位100件</text>
<rect x="672" y="110" width="248" height="140" rx="8" fill="#fff7ed" stroke="#fed7aa" stroke-width="1.5"/>
<text x="796" y="142" font-size="14" font-weight="600" fill="#111827" text-anchor="middle">2段目: float32 で再採点</text>
<text x="796" y="168" font-size="12" fill="#6b7280" text-anchor="middle">正確な内積(SIMD)</text>
<text x="796" y="194" font-size="12" fill="#111827" text-anchor="middle">100件だけなので +0.05ms</text>
<text x="796" y="220" font-size="12" fill="#16a34a" text-anchor="middle">Recall@10 = 0.87 に回復</text>
<line x1="796" y1="250" x2="796" y2="300" stroke="#2563eb" stroke-width="2" marker-end="url(#ab)"/>
<rect x="696" y="306" width="200" height="56" rx="8" fill="#faf5ff" stroke="#e9d5ff" stroke-width="1.5"/>
<text x="796" y="330" font-size="13" font-weight="600" fill="#111827" text-anchor="middle">top-10 を返す</text>
<text x="796" y="350" font-size="12" fill="#6b7280" text-anchor="middle">合計 0.73ms(naive比 39倍)</text>
<rect x="40" y="306" width="560" height="110" rx="8" fill="#f9fafb" stroke="#d1d5db" stroke-width="1"/>
<text x="60" y="336" font-size="13" font-weight="600" fill="#111827">ポイント: 速度と精度は二者択一ではない</text>
<text x="60" y="362" font-size="12" fill="#111827">・1段目で候補を 1/1000 に絞るのはビット演算なのでタダ同然</text>
<text x="60" y="384" font-size="12" fill="#111827">・2段目の正確な計算は 100件分だけ → キャッシュに乗っていて速い</text>
<text x="60" y="406" font-size="12" fill="#6b7280">ClickHouse の QBit など最新ベクトルDBも同じ思想</text>
</svg>