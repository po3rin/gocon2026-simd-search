<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 640">
<style>text{font-family:'Helvetica Neue',Helvetica,Arial,'Hiragino Sans','Hiragino Kaku Gothic ProN',sans-serif;fill:#111827} .mono{font-family:Menlo,Consolas,monospace}</style>
<rect width="960" height="640" fill="#ffffff"/>
<text x="480" y="34" font-size="18" font-weight="600" text-anchor="middle">VZEROUPPER の遷移ペナルティ</text>
<text x="480" y="58" font-size="12" fill="#6b7280" text-anchor="middle">同じ SIMD 内積が、境界の 1 命令の有無で 167.4ns と 23.4ns に分かれる(AWS c7i、Intel Sapphire Rapids)</text>

<!-- 1. レジスタの構造 -->
<text x="60" y="96" font-size="13.5" font-weight="600">前提: YMM レジスタ(256bit)の構造</text>
<rect x="240" y="108" width="240" height="44" fill="#fff7ed" stroke="#fb923c" stroke-width="1.5"/>
<text x="360" y="135" font-size="12.5" text-anchor="middle">上位 128bit</text>
<rect x="480" y="108" width="240" height="44" fill="#eff6ff" stroke="#93c5fd" stroke-width="1.5"/>
<text x="600" y="135" font-size="12.5" text-anchor="middle">下位 128bit(XMM と同じ場所)</text>
<text x="240" y="176" font-size="11.5" fill="#9a3412">AVX2 の FMA は 256bit 全体に書く。実行後は上位 128bit に値が残る(この状態を dirty と呼ぶ)</text>
<text x="240" y="196" font-size="11.5" fill="#1d4ed8">水平和などのスカラ計算は、下位 128bit しか知らない古い命令(レガシー SSE)で出力される</text>

<!-- 2. 実行の流れ -->
<text x="60" y="240" font-size="13.5" font-weight="600">実行の流れ: 違いは境界の 1 命令だけ</text>

<text x="60" y="282" font-size="12">VZEROUPPER なし</text>
<rect x="200" y="258" width="200" height="38" rx="4" fill="#eff6ff" stroke="#93c5fd" stroke-width="1.5"/>
<text x="300" y="282" font-size="12" text-anchor="middle">SIMD 内積(FMA の繰り返し)</text>
<rect x="408" y="258" width="110" height="38" rx="4" fill="#ffffff" stroke="#d1d5db" stroke-width="1.5" stroke-dasharray="5,4"/>
<text x="463" y="282" font-size="11.5" fill="#6b7280" text-anchor="middle">境界: 何もない</text>
<rect x="530" y="258" width="200" height="22" rx="4" fill="#eff6ff" stroke="#93c5fd" stroke-width="1.5"/>
<text x="630" y="274" font-size="11.5" text-anchor="middle">水平和(レガシー SSE)</text>
<rect x="530" y="280" width="200" height="16" rx="4" fill="#ffedd5" stroke="#fb923c" stroke-width="1.5"/>
<text x="630" y="292" font-size="10" fill="#9a3412" text-anchor="middle">命令ごとにマージ処理が挟まる</text>
<text x="530" y="316" font-size="11" fill="#9a3412">上位が dirty のままだと、CPU が上位の値を守るための処理を毎回追加する</text>

<text x="60" y="374" font-size="12">VZEROUPPER あり</text>
<rect x="200" y="350" width="200" height="38" rx="4" fill="#eff6ff" stroke="#93c5fd" stroke-width="1.5"/>
<text x="300" y="374" font-size="12" text-anchor="middle">SIMD 内積(FMA の繰り返し)</text>
<rect x="408" y="350" width="110" height="38" rx="4" fill="#f0fdf4" stroke="#4ade80" stroke-width="1.5"/>
<text x="463" y="369" font-size="10.5" text-anchor="middle" class="mono">VZEROUPPER</text>
<text x="463" y="382" font-size="9.5" fill="#15803d" text-anchor="middle">上位をゼロに掃除</text>
<rect x="530" y="350" width="200" height="38" rx="4" fill="#eff6ff" stroke="#93c5fd" stroke-width="1.5"/>
<text x="630" y="374" font-size="11.5" text-anchor="middle">水平和(レガシー SSE)</text>
<text x="530" y="408" font-size="11" fill="#15803d">上位が綺麗なので、水平和はそのまま実行されるだけ</text>

<!-- 3. 時間の内訳 -->
<text x="60" y="452" font-size="13.5" font-weight="600">かかった時間(内積 1 回、384 次元)</text>

<text x="60" y="486" font-size="12">なし</text>
<rect x="200" y="466" width="92" height="28" fill="#dbeafe" stroke="#93c5fd" stroke-width="1.5"/>
<text x="246" y="484" font-size="11" text-anchor="middle">計算</text>
<rect x="292" y="466" width="568" height="28" fill="#fed7aa" stroke="#fb923c" stroke-width="1.5"/>
<text x="576" y="484" font-size="11.5" fill="#9a3412" text-anchor="middle">ペナルティ 約 145ns(マージ処理の積み重ね)</text>
<text x="868" y="485" font-size="13" font-weight="600" text-anchor="start">167.4ns</text>

<text x="60" y="532" font-size="12">あり</text>
<rect x="200" y="512" width="92" height="28" fill="#dbeafe" stroke="#93c5fd" stroke-width="1.5"/>
<text x="246" y="530" font-size="11" text-anchor="middle">計算</text>
<rect x="292" y="512" width="6" height="28" fill="#bbf7d0" stroke="#4ade80" stroke-width="1"/>
<text x="308" y="531" font-size="13" font-weight="600" text-anchor="start">23.4ns(7.1x)</text>

<text x="60" y="584" font-size="11.5" fill="#6b7280">このペナルティは Intel の CPU で起きる(AMD では起きない)。Go のコンパイラは VZEROUPPER を自動では入れないので、</text>
<text x="60" y="604" font-size="11.5" fill="#6b7280">境界で標準 API の archsimd.ClearAVXUpperBits()(中身は VZEROUPPER 1 命令)を呼ぶと「あり」の側になる。</text>
</svg>
