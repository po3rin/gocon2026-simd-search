<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 720" font-family="Hiragino Sans,PingFang SC,Helvetica Neue,Arial,sans-serif">
<defs>
<marker id="ar-g" markerWidth="10" markerHeight="7" refX="8" refY="3.5" orient="auto"><polygon points="0 0,10 3.5,0 7" fill="#6b7280"/></marker>
<marker id="ar-r" markerWidth="10" markerHeight="7" refX="8" refY="3.5" orient="auto"><polygon points="0 0,10 3.5,0 7" fill="#dc2626"/></marker>
<marker id="ar-gr" markerWidth="10" markerHeight="7" refX="8" refY="3.5" orient="auto"><polygon points="0 0,10 3.5,0 7" fill="#16a34a"/></marker>
</defs>
<rect x="0" y="0" width="980" height="720" fill="#ffffff"/>
<text x="490" y="34" text-anchor="middle" font-size="21" font-weight="700" fill="#111827">VZEROUPPER の遷移ペナルティ: SIMD からスカラへ戻る境界で起きる</text>
<text x="490" y="58" text-anchor="middle" font-size="14" fill="#6b7280">同じコードでも、境界の1命令の有無で 167ns &#8594; 23ns（7.1x）</text>
<rect x="40" y="72" width="430" height="40" rx="8" ry="8" fill="#fee2e2" stroke="#dc2626" stroke-width="2"/>
<text x="255" y="98" font-size="16" font-weight="700" fill="#b91c1c" text-anchor="middle">&#10007; VZEROUPPER なし = 167ns</text>
<rect x="510" y="72" width="430" height="40" rx="8" ry="8" fill="#dcfce7" stroke="#16a34a" stroke-width="2"/>
<text x="725" y="98" font-size="16" font-weight="700" fill="#15803d" text-anchor="middle">&#10003; VZEROUPPER あり = 23ns</text>
<rect x="40" y="130" width="430" height="64" rx="8" ry="8" fill="#fff7ed" stroke="#fdba74" stroke-width="1.5"/>
<text x="58" y="156" font-size="14" font-weight="600" fill="#9a3412" text-anchor="start">&#9312; AVX2 FMA を実行（YMM 256bit を使う）</text>
<text x="58" y="178" font-size="12.5" font-weight="400" fill="#b45309" text-anchor="start">&#8594; YMM レジスタの上位128bitが dirty（汚れた）状態</text>
<rect x="510" y="130" width="430" height="64" rx="8" ry="8" fill="#fff7ed" stroke="#fdba74" stroke-width="1.5"/>
<text x="528" y="156" font-size="14" font-weight="600" fill="#9a3412" text-anchor="start">&#9312; AVX2 FMA を実行（YMM 256bit を使う）</text>
<text x="528" y="178" font-size="12.5" font-weight="400" fill="#b45309" text-anchor="start">&#8594; YMM レジスタの上位128bitが dirty（汚れた）状態</text>
<rect x="40" y="212" width="430" height="52" rx="8" ry="8" fill="#ffffff" stroke="#d1d5db" stroke-width="1.5" stroke-dasharray="5,4"/>
<text x="58" y="243" font-size="14" font-weight="400" fill="#374151" text-anchor="start">&#9313; 境界：何もしない（掃除しない）</text>
<rect x="510" y="212" width="430" height="52" rx="8" ry="8" fill="#f0fdf4" stroke="#16a34a" stroke-width="2"/>
<text x="528" y="234" font-size="14" font-weight="700" fill="#15803d" text-anchor="start">&#9313; 境界：VZEROUPPER を1命令だけ実行</text>
<text x="528" y="254" font-size="12.5" font-weight="400" fill="#16a34a" text-anchor="start">&#8594; YMM 上位128bit をゼロに掃除</text>
<rect x="40" y="290" width="430" height="58" rx="8" ry="8" fill="#ffffff" stroke="#d1d5db" stroke-width="1.5"/>
<text x="58" y="314" font-size="14" font-weight="400" fill="#374151" text-anchor="start">&#9314; スカラの水平和 sum = buf[0]+buf[1]+…</text>
<text x="58" y="334" font-size="12.5" font-weight="400" fill="#6b7280" text-anchor="start">&#8594; Go はこれをレガシー SSE 命令で出力</text>
<rect x="510" y="290" width="430" height="58" rx="8" ry="8" fill="#ffffff" stroke="#d1d5db" stroke-width="1.5"/>
<text x="528" y="314" font-size="14" font-weight="400" fill="#374151" text-anchor="start">&#9314; スカラの水平和（レガシー SSE）</text>
<text x="528" y="334" font-size="12.5" font-weight="400" fill="#6b7280" text-anchor="start">&#8594; 上位は綺麗なので普通に実行されるだけ</text>
<rect x="40" y="372" width="430" height="84" rx="8" ry="8" fill="#fef2f2" stroke="#f87171" stroke-width="2"/>
<text x="58" y="396" font-size="14" font-weight="700" fill="#b91c1c" text-anchor="start">&#9888; 衝突：dirty な YMM上位 × レガシーSSE</text>
<text x="58" y="418" font-size="12.5" font-weight="400" fill="#dc2626" text-anchor="start">&#8594; レガシーSSE 1命令ごとに、CPU が</text>
<text x="58" y="438" font-size="12.5" font-weight="400" fill="#dc2626" text-anchor="start">   false dependency（偽の依存）+ merge(blend) μop を挿入</text>
<rect x="510" y="372" width="430" height="84" rx="8" ry="8" fill="#f0fdf4" stroke="#4ade80" stroke-width="2"/>
<text x="528" y="402" font-size="14" font-weight="700" fill="#15803d" text-anchor="start">&#10003; 衝突なし</text>
<text x="528" y="426" font-size="12.5" font-weight="400" fill="#16a34a" text-anchor="start">&#8594; false dependency なし / merge μop なし</text>
<rect x="40" y="478" width="430" height="60" rx="8" ry="8" fill="#fee2e2" stroke="#dc2626" stroke-width="2"/>
<text x="58" y="502" font-size="13.5" font-weight="700" fill="#b91c1c" text-anchor="start">遅い：呼び出しごとに固定費 ≒145ns(550cyc) が乗る</text>
<text x="452" y="528" font-size="18" font-weight="700" fill="#b91c1c" text-anchor="end">= 167ns</text>
<rect x="510" y="478" width="430" height="60" rx="8" ry="8" fill="#dcfce7" stroke="#16a34a" stroke-width="2"/>
<text x="528" y="502" font-size="13.5" font-weight="700" fill="#15803d" text-anchor="start">速い：固定費が消える</text>
<text x="922" y="528" font-size="18" font-weight="700" fill="#15803d" text-anchor="end">= 23ns</text>
<line x1="255" y1="194" x2="255" y2="210" stroke="#6b7280" stroke-width="2" marker-end="url(#ar-g)"/>
<line x1="255" y1="264" x2="255" y2="288" stroke="#6b7280" stroke-width="2" marker-end="url(#ar-g)"/>
<line x1="725" y1="194" x2="725" y2="210" stroke="#6b7280" stroke-width="2" marker-end="url(#ar-g)"/>
<line x1="725" y1="264" x2="725" y2="288" stroke="#6b7280" stroke-width="2" marker-end="url(#ar-g)"/>
<line x1="255" y1="348" x2="255" y2="370" stroke="#dc2626" stroke-width="2" marker-end="url(#ar-r)"/>
<line x1="255" y1="456" x2="255" y2="476" stroke="#dc2626" stroke-width="2" marker-end="url(#ar-r)"/>
<line x1="725" y1="348" x2="725" y2="370" stroke="#16a34a" stroke-width="2" marker-end="url(#ar-gr)"/>
<line x1="725" y1="456" x2="725" y2="476" stroke="#16a34a" stroke-width="2" marker-end="url(#ar-gr)"/>
<rect x="40" y="560" width="900" height="132" rx="8" ry="8" fill="#f9fafb" stroke="#e5e7eb" stroke-width="1.5"/>
<text x="60" y="588" font-size="15" font-weight="700" fill="#111827" text-anchor="start">たった1命令 VZEROUPPER で 167 &#8594; 23ns = 7.1x（AWS c7i / Sapphire Rapids 実測）</text>
<text x="60" y="614" font-size="13" font-weight="400" fill="#374151" text-anchor="start">・教科書でいう「一度きりの大きな遷移ペナルティ（モード切替）」は Haswell 世代までの話。</text>
<text x="60" y="636" font-size="13" font-weight="400" fill="#374151" text-anchor="start">・Skylake 以降は仕組みが変わり、『レガシーSSE 1命令ごと』に小さなペナルティが蓄積する形になった。</text>
<text x="60" y="658" font-size="13" font-weight="400" fill="#374151" text-anchor="start">・VZEROUPPER はその蓄積をまとめて消す。ただし効果はベンダー差あり（AMD Zen では小さい）。</text>
<text x="60" y="680" font-size="13" font-weight="400" fill="#6b7280" text-anchor="start">・Go 1.26 / 1.27 の archsimd は VZEROUPPER を自動挿入しないため、境界で archsimd.ClearAVXUpperBits() を呼んでいる。</text>
</svg>
