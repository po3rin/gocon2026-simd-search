<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 440">
<style>text{font-family:'Helvetica Neue',Helvetica,Arial,'Hiragino Sans','Hiragino Kaku Gothic ProN',sans-serif;}</style>
<rect width="960" height="440" fill="#ffffff"/>
<text x="480" y="32" font-size="18" font-weight="600" fill="#111827" text-anchor="middle">メモリ時間 vs 演算時間 — バッチ化で律速が反転(ルーフライン分解)</text>
<text x="480" y="54" font-size="11.5" fill="#6b7280" text-anchor="middle">go 実測の天井(演算 25.5 GFLOP/s・read 帯域 18.4 GB/s, make roofline-ceiling)から計算。実時間 ≈ 長い方(max)。</text>
<text x="120" y="154" font-size="13.5" font-weight="600" fill="#111827" text-anchor="middle">全探索 (B=1)</text>
<text x="120" y="172" font-size="11" fill="#6b7280" text-anchor="middle">AI=0.5</text>
<rect x="240" y="130" width="416.2" height="30" fill="#dbeafe" stroke="#60a5fa" stroke-width="1.6"/>
<text x="448.1" y="150.0" font-size="12" fill="#1e40af" text-anchor="middle">メモリ時間 (運ぶbyte / 帯域)</text>
<rect x="240" y="168.0" width="150.0" height="30" fill="#ffedd5" stroke="#fb923c" stroke-width="1.6"/>
<text x="315.0" y="188.0" font-size="12" fill="#9a3412" text-anchor="middle">演算時間 (2flop / ピーク)</text>
<text x="666.2" y="150.0" font-size="12" font-weight="600" fill="#1e40af" text-anchor="start">← 律速: メモリ</text>
<text x="120" y="304" font-size="13.5" font-weight="600" fill="#111827" text-anchor="middle">バッチ (B=32)</text>
<text x="120" y="322" font-size="11" fill="#6b7280" text-anchor="middle">AI=16</text>
<rect x="240" y="280" width="13.0" height="30" fill="#dbeafe" stroke="#60a5fa" stroke-width="1.6"/>
<text x="261.0" y="300.0" font-size="12" fill="#6b7280" text-anchor="start">メモリ時間</text>
<rect x="240" y="318.0" width="150.0" height="30" fill="#ffedd5" stroke="#fb923c" stroke-width="1.6"/>
<text x="315.0" y="338.0" font-size="12" fill="#9a3412" text-anchor="middle">演算時間 (2flop / ピーク)</text>
<text x="400.0" y="338.0" font-size="12" font-weight="600" fill="#9a3412" text-anchor="start">← 律速: 演算</text>
<text x="480" y="372" font-size="12.5" font-weight="600" fill="#111827" text-anchor="middle">バッチ化(B=32)で「演算時間」は不変、「メモリ時間」だけ 1/32 に縮む → 律速がメモリ→演算へ反転</text>
<rect x="300" y="392" width="14" height="14" rx="3" fill="#dbeafe" stroke="#60a5fa" stroke-width="1.5"/>
<text x="320" y="403" font-size="11.5" fill="#374151">メモリ時間 = 運ぶbyte / 帯域</text>
<rect x="560" y="392" width="14" height="14" rx="3" fill="#ffedd5" stroke="#fb923c" stroke-width="1.5"/>
<text x="580" y="403" font-size="11.5" fill="#374151">演算時間 = flop / 演算ピーク</text>
<text x="480" y="428" font-size="10.5" fill="#9ca3af" text-anchor="middle">※ ルーフラインの理想値。実測は spill 等でこれより遅い(本文)。この内訳は pprof/trace では出せず、ルーフラインが与える。</text>
</svg>
