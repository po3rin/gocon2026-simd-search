<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 520" font-family="'Hiragino Sans','Noto Sans CJK JP',sans-serif">
<style>.t{fill:#0f172a}.m{fill:#64748b}</style>
<rect width="960" height="520" fill="#ffffff"/>
<text x="40" y="40" font-size="21" font-weight="700" class="t">ルーフライン(屋根)の形 — 点を打つ前の「地図」</text>
<text x="40" y="62" font-size="13" class="m">縦=出せる性能 / 横=算術強度。屋根は2本(メモリ斜線・演算水平線)。どんなコードもこの下にしか到達できない。</text>
<path d="M 130 430 L 500 160 L 500 430 Z" fill="#eff6ff"/>
<path d="M 500 160 L 880 160 L 880 430 L 500 430 Z" fill="#fffbeb"/>
<line x1="130" y1="430" x2="880" y2="430" stroke="#0f172a" stroke-width="1.4"/>
<line x1="130" y1="80" x2="130" y2="430" stroke="#0f172a" stroke-width="1.4"/>
<text x="880" y="460" font-size="13" font-weight="600" class="t" text-anchor="end">算術強度 AI (flop/byte) →</text>
<text x="40" y="74" font-size="13" font-weight="600" class="t">↑ 性能 (GFLOP/s)</text>
<line x1="130" y1="430" x2="500" y2="160" stroke="#dc2626" stroke-width="2.6"/>
<line x1="500" y1="160" x2="880" y2="160" stroke="#dc2626" stroke-width="2.6"/>
<text x="250" y="333" font-size="13" fill="#dc2626" font-weight="600" transform="rotate(-33 250 333)">メモリ帯域で決まる斜線</text>
<text x="880" y="150" font-size="13" fill="#dc2626" font-weight="600" text-anchor="end">演算ピークで決まる水平線</text>
<line x1="500" y1="160" x2="500" y2="430" stroke="#94a3b8" stroke-width="1.2" stroke-dasharray="3 4"/>
<circle cx="500" cy="160" r="5" fill="#ffffff" stroke="#dc2626" stroke-width="2"/>
<text x="500" y="146" font-size="13" fill="#0f172a" font-weight="700" text-anchor="middle">リッジ</text>
<text x="500" y="460" font-size="12" class="m" text-anchor="middle">折れ点</text>
<text x="300" y="250" font-size="15" font-weight="700" fill="#1d4ed8" text-anchor="middle">← メモリ律速</text>
<text x="300" y="272" font-size="12" fill="#1d4ed8" text-anchor="middle">運ぶのが間に合わない</text>
<text x="690" y="250" font-size="15" font-weight="700" fill="#b45309" text-anchor="middle">演算律速 →</text>
<text x="690" y="272" font-size="12" fill="#b45309" text-anchor="middle">計算が間に合わない</text>
<text x="300" y="408" font-size="11.5" class="m" text-anchor="middle">点が左にあれば「データ設計を変える(横へ)」</text>
<text x="690" y="408" font-size="11.5" class="m" text-anchor="middle">点が右にあれば「計算を効率化(縦へ)」</text>
</svg>