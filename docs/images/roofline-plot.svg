<text x="122" y="200.7" font-size="12" class="m" text-anchor="end">100</text>
<line x1="130" y1="60.0" x2="880" y2="60.0" stroke="#eef2f7"/>
<text x="122" y="64.0" font-size="12" class="m" text-anchor="end">1000</text>
<line x1="130" y1="470" x2="880" y2="470" stroke="#0f172a" stroke-width="1.4"/>
<line x1="130" y1="60" x2="130" y2="470" stroke="#0f172a" stroke-width="1.4"/>
<text x="880" y="508" font-size="13" font-weight="600" class="t" text-anchor="end">算術強度 AI (flop/byte) →</text>
<text x="40" y="56" font-size="13" font-weight="600" class="t">↑ 性能 (GFLOP/s)</text>
