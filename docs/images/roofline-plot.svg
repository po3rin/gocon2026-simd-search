<text x="878.0" y="191.7" font-size="10.5" fill="#64748b" text-anchor="end">AVX2 理論 ~100</text>
<path d="M 130.0 433.8 L 415.5 277.8 L 880.0 277.8" stroke="#dc2626" stroke-width="2.6" fill="none"/>
<text x="272.0" y="362.0" font-size="11.5" fill="#dc2626" font-weight="600" transform="rotate(-29 272 362)">DRAM ~20 GB/s (read)</text>
