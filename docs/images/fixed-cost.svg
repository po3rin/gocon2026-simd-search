<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540">
<style>text{font-family:'Helvetica Neue', Helvetica, Arial, 'Hiragino Sans', 'Hiragino Kaku Gothic ProN', sans-serif;}</style>
<rect width="960" height="540" fill="#ffffff"/>
<text x="480" y="36" font-size="18" font-weight="600" fill="#111827" text-anchor="middle">ベンチのスケールを変えて「固定費」をあぶり出す</text>
<text x="480" y="60" font-size="12" fill="#6b7280" text-anchor="middle">同じSIMD実装でも、次元が小さいと固定費に食われ、次元が大きいと本来の速さが見える</text>
<rect x="60" y="90" width="400" height="360" rx="8" fill="#ffffff" stroke="#d1d5db" stroke-width="1.5"/>
<text x="260" y="118" font-size="14" font-weight="600" fill="#111827" text-anchor="middle">dim = 384(1呼び出しの仕事が小さい)</text>
<rect x="130" y="170" width="90" height="250" fill="#bfdbfe" stroke="#93c5fd"/>
<text x="175" y="440" font-size="12" fill="#111827" text-anchor="middle">naive</text>
<text x="175" y="160" font-size="12" font-weight="600" fill="#111827" text-anchor="middle">208ns</text>
<rect x="290" y="224" width="90" height="174" fill="#fecaca" stroke="#fca5a5"/>
<rect x="290" y="398" width="90" height="22" fill="#bbf7d0" stroke="#86efac"/>
<text x="335" y="440" font-size="12" fill="#111827" text-anchor="middle">SIMD(unsafe+4acc)</text>
<text x="335" y="214" font-size="12" font-weight="600" fill="#111827" text-anchor="middle">163ns</text>
<text x="335" y="320" font-size="11" fill="#991b1b" text-anchor="middle">固定費 145ns</text>
<text x="335" y="413" font-size="10" fill="#14532d" text-anchor="middle">ループ ~20ns</text>
<text x="260" y="470" font-size="13" fill="#dc2626" text-anchor="middle">たった 1.2倍(固定費が支配)</text>
<rect x="500" y="90" width="400" height="360" rx="8" fill="#ffffff" stroke="#d1d5db" stroke-width="1.5"/>
<text x="700" y="118" font-size="14" font-weight="600" fill="#111827" text-anchor="middle">dim = 4096(仕事を10倍にして固定費を薄める)</text>
<rect x="570" y="140" width="90" height="280" fill="#bfdbfe" stroke="#93c5fd"/>
<text x="615" y="440" font-size="12" fill="#111827" text-anchor="middle">naive</text>
<text x="615" y="130" font-size="12" font-weight="600" fill="#111827" text-anchor="middle">2386ns</text>
<rect x="730" y="378" width="90" height="17" fill="#fecaca" stroke="#fca5a5"/>
<rect x="730" y="395" width="90" height="25" fill="#bbf7d0" stroke="#86efac"/>
<text x="775" y="440" font-size="12" fill="#111827" text-anchor="middle">SIMD(unsafe+4acc)</text>
<text x="775" y="368" font-size="12" font-weight="600" fill="#111827" text-anchor="middle">354ns</text>
<text x="700" y="470" font-size="13" fill="#16a34a" text-anchor="middle">6.7倍!(SIMDは最初から速かった)</text>
<rect x="330" y="500" width="14" height="14" fill="#fecaca" stroke="#fca5a5"/>
<text x="352" y="512" font-size="12" fill="#111827">呼び出しごとの固定費(~145ns)</text>
<rect x="580" y="500" width="14" height="14" fill="#bbf7d0" stroke="#86efac"/>
<text x="602" y="512" font-size="12" fill="#111827">SIMDループ本体</text>
</svg>