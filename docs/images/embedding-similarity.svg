<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 440">
<defs>
<marker id="ab" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto"><polygon points="0 0, 10 3.5, 0 7" fill="#2563eb"/></marker>
<marker id="ag" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto"><polygon points="0 0, 10 3.5, 0 7" fill="#16a34a"/></marker>
<marker id="ar" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto"><polygon points="0 0, 10 3.5, 0 7" fill="#dc2626"/></marker>
<marker id="ax" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#9ca3af"/></marker>
</defs>
<style>text{font-family:'Helvetica Neue', Helvetica, Arial, 'Hiragino Sans', 'Hiragino Kaku Gothic ProN', sans-serif;}</style>
<rect width="960" height="440" fill="#ffffff"/>
<text x="480" y="36" font-size="18" font-weight="600" fill="#111827" text-anchor="middle">埋め込み: 意味が近い文章ほどベクトルの向きが揃う</text>

<!-- 左: 文章 → ベクトル -->
<text x="60" y="76" font-size="13" fill="#6b7280">文章</text>
<text x="330" y="76" font-size="13" fill="#6b7280">埋め込みモデル</text>
<text x="500" y="76" font-size="13" fill="#6b7280">ベクトル(数百次元)</text>

<rect x="60" y="96" width="200" height="44" rx="6" fill="#eff6ff" stroke="#bfdbfe" stroke-width="1.5"/>
<text x="160" y="123" font-size="14" fill="#111827" text-anchor="middle">A 「猫が好き」</text>
<line x1="270" y1="118" x2="490" y2="118" stroke="#2563eb" stroke-width="1.5" marker-end="url(#ab)"/>
<rect x="500" y="96" width="200" height="44" rx="6" fill="#eff6ff" stroke="#bfdbfe" stroke-width="1.5"/>
<text x="600" y="123" font-size="13" fill="#111827" text-anchor="middle" font-family="Menlo, monospace">[ 0.2, -0.1,  0.8, …]</text>

<rect x="60" y="166" width="200" height="44" rx="6" fill="#f0fdf4" stroke="#bbf7d0" stroke-width="1.5"/>
<text x="160" y="193" font-size="14" fill="#111827" text-anchor="middle">B 「犬を飼う」</text>
<line x1="270" y1="188" x2="490" y2="188" stroke="#2563eb" stroke-width="1.5" marker-end="url(#ab)"/>
<rect x="500" y="166" width="200" height="44" rx="6" fill="#f0fdf4" stroke="#bbf7d0" stroke-width="1.5"/>
<text x="600" y="193" font-size="13" fill="#111827" text-anchor="middle" font-family="Menlo, monospace">[ 0.1, -0.2,  0.7, …]</text>

<rect x="60" y="236" width="200" height="44" rx="6" fill="#fff7ed" stroke="#fed7aa" stroke-width="1.5"/>
<text x="160" y="263" font-size="14" fill="#111827" text-anchor="middle">C 「株価が急落」</text>
<line x1="270" y1="258" x2="490" y2="258" stroke="#2563eb" stroke-width="1.5" marker-end="url(#ab)"/>
<rect x="500" y="236" width="200" height="44" rx="6" fill="#fff7ed" stroke="#fed7aa" stroke-width="1.5"/>
<text x="600" y="263" font-size="13" fill="#111827" text-anchor="middle" font-family="Menlo, monospace">[-0.6,  0.5, -0.2, …]</text>

<!-- 右: 向きの図 -->
<rect x="740" y="60" width="180" height="230" rx="8" fill="#f9fafb" stroke="#d1d5db" stroke-width="1"/>
<text x="830" y="82" font-size="12" fill="#6b7280" text-anchor="middle">向きを 2 次元で描くと</text>
<line x1="760" y1="250" x2="910" y2="250" stroke="#9ca3af" stroke-width="1" marker-end="url(#ax)"/>
<line x1="790" y1="280" x2="790" y2="100" stroke="#9ca3af" stroke-width="1" marker-end="url(#ax)"/>
<line x1="790" y1="250" x2="880" y2="130" stroke="#2563eb" stroke-width="2.5" marker-end="url(#ab)"/>
<text x="888" y="126" font-size="13" fill="#2563eb" font-weight="600">A</text>
<line x1="790" y1="250" x2="892" y2="150" stroke="#16a34a" stroke-width="2.5" marker-end="url(#ag)"/>
<text x="898" y="158" font-size="13" fill="#16a34a" font-weight="600">B</text>
<line x1="790" y1="250" x2="760" y2="140" stroke="#dc2626" stroke-width="2.5" marker-end="url(#ar)"/>
<text x="748" y="132" font-size="13" fill="#dc2626" font-weight="600">C</text>

<!-- 下: 読み方 -->
<rect x="60" y="316" width="860" height="92" rx="8" fill="#ffffff" stroke="#d1d5db" stroke-width="1.5"/>
<text x="80" y="346" font-size="14" fill="#111827"><tspan font-weight="600" fill="#2563eb">A と B</tspan>: 向きが近い。内積が大きい。意味が近いと判定する</text>
<text x="80" y="374" font-size="14" fill="#111827"><tspan font-weight="600" fill="#dc2626">A と C</tspan>: 向きが違う。内積が小さい(負にもなる)。意味が遠いと判定する</text>
<text x="80" y="398" font-size="12" fill="#6b7280">検索では、クエリのベクトルと全文書のベクトルの内積を計算し、大きい順に上位 k 件を返す</text>
</svg>
