name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

env:
  GOEXPERIMENT: simd

jobs:
  test:
    name: test (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        # ubuntu は amd64(AVX2 パス)、macos は arm64(Neon パス)、windows は amd64 を
        # Windows 環境で通す(GOOS が違っても SIMD パスは同じ amd64 実装)
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          check-latest: true
      - run: go vet ./...
      - run: go test ./...

  lint:
    name: lint (GOARCH=${{ matrix.goarch }})
    strategy:
      fail-fast: false
      matrix:
        # amd64 と arm64 でビルドタグが違うファイルがあるので両方を型検査する
        goarch: [amd64, arm64]
    runs-on: ubuntu-latest
    env:
      GOARCH: ${{ matrix.goarch }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          check-latest: true
      - uses: golangci/golangci-lint-action@v9
        with:
          version: v2.13.2

  fmt:
    name: gofmt
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          check-latest: true
      - name: gofmt -l が何も出さないことを確認
        run: |
          out=$(gofmt -l .)
          if [ -n "$out" ]; then
            echo "gofmt が必要なファイル:"; echo "$out"; exit 1
          fi

  # GOEXPERIMENT なしでも壊れないことの確認(フォールバック実装
  # dot_fallback.go / int8_fallback.go / dot_portable_fallback.go /
  # hamming_simd_fallback.go / report_stub.go はここでしかコンパイルされない)
  build-nosimd:
    name: build (GOEXPERIMENT なし)
    runs-on: ubuntu-latest
    env:
      GOEXPERIMENT: ""
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          check-latest: true
      - run: go vet ./...
      - run: go test ./...

  # 生成図(docs/images の SVG)が cmd/roofline-figures の現在のコードと一致していることの確認。
  # 引数は Makefile の roofline-figures と揃えること
  figures:
    name: 生成図の鮮度チェック
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          check-latest: true
      - run: |
          mkdir -p /tmp/figs
          go run ./cmd/roofline-figures -peak 25.59 -bw 20.80 -tpeak 110 -out /tmp/figs
          for f in /tmp/figs/*.svg; do
            diff -u "docs/images/$(basename "$f")" "$f" || { echo "図が古い: make roofline-figures を実行してコミットしてください"; exit 1; }
          done
